<style>
:root {
  --purple: #6a1b9a;
  --purple-mid: #7b1fa2;
  --purple-dark: #4a148c;
  --purple-light: #f3e5f5;
  --purple-accent: #ab47bc;
  --white: #fff;
  --gray-bg: #faf5ff;
  --gray-border: #e1d5ea;
  --gray-text: #7b6b8a;
  --text: #1a0a2e;
  --red: #c62828;
  --green: #2e7d32;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 16px rgba(106,27,154,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--gray-bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
}

/* HEADER */
.header {
  background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-mid) 100%);
  padding: 48px 18px 14px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
}
.header-back {
  width: 34px; height: 34px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%; border: none;
  color: white; font-size: 18px;
  cursor: pointer;
  display: none; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-back.visible { display: flex; }
.header-title { font-size: 19px; font-weight: 600; color: white; flex: 1; }
.cart-btn {
  position: relative;
  width: 42px; height: 42px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%; border: none;
  color: white; font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.cart-btn:active { background: rgba(255,255,255,0.25); }
.cart-count {
  position: absolute;
  top: -4px; right: -4px;
  background: #ff6b35;
  color: white;
  font-size: 10px; font-weight: 700;
  min-width: 18px; height: 18px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
  font-family: 'DM Mono', monospace;
  display: none;
}
.cart-count.visible { display: flex; }
.progress-bar {
  height: 3px;
  background: rgba(255,255,255,0.2);
  flex-shrink: 0;
}
.progress-fill {
  height: 100%;
  background: #ce93d8;
  transition: width 0.3s;
  width: 0%;
}

/* CONTENT */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* SCREENS */
.screen { display: none; }
.screen.active { display: block; }

/* CATEGORÍAS */
.section-label {
  padding: 14px 18px 8px;
  font-size: 11px; font-weight: 600;
  color: var(--gray-text);
  letter-spacing: .06em;
  text-transform: uppercase;
}
.cat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 14px 20px;
}
.cat-card {
  background: var(--white);
  border: 1.5px solid var(--gray-border);
  border-radius: var(--radius);
  padding: 20px 10px 16px;
  text-align: center;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  position: relative;
  box-shadow: var(--shadow);
  transition: border-color 0.15s, transform 0.1s;
}
.cat-card:active { transform: scale(0.97); }
.cat-card.has-items {
  border-color: var(--purple-accent);
  background: var(--purple-light);
}
.cat-emoji { font-size: 36px; line-height: 1; }
.cat-name { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
.cat-count { font-size: 11px; color: var(--gray-text); }
.cat-badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--purple-accent); color: white;
  font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 10px;
  font-family: 'DM Mono', monospace;
  display: none;
}
.cat-badge.visible { display: block; }

/* PRODUCTOS */
.search-wrap { padding: 10px 14px 6px; position: relative; }
.search-input {
  width: 100%;
  padding: 11px 14px 11px 40px;
  border: 1.5px solid var(--gray-border);
  border-radius: 10px;
  background: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; color: var(--text); outline: none;
}
.search-input:focus { border-color: var(--purple-accent); }
.search-icon {
  position: absolute; left: 26px; top: 50%;
  transform: translateY(-50%);
  font-size: 16px; color: var(--gray-text); pointer-events: none;
}
.prod-list { padding: 4px 14px 20px; }
.prod-item {
  background: var(--white);
  border-radius: var(--radius-sm);
  margin-bottom: 7px;
  padding: 13px 14px;
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--gray-border);
  transition: border-color 0.15s;
  box-shadow: 0 1px 4px rgba(106,27,154,0.06);
}
.prod-item.selected {
  border-color: var(--purple-accent);
  background: var(--purple-light);
}
.prod-name { flex: 1; font-size: 14px; color: var(--text); line-height: 1.4; }
.qty-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.qty-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1.5px solid var(--gray-border);
  background: var(--white);
  color: var(--purple-mid);
  font-size: 20px; font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none;
  transition: background 0.1s;
}
.qty-btn:active { background: var(--purple-light); border-color: var(--purple-accent); }
.qty-num {
  min-width: 26px; text-align: center;
  font-size: 16px; font-weight: 700;
  color: var(--gray-text);
  font-family: 'DM Mono', monospace;
}
.qty-num.pos { color: var(--purple-mid); }

/* CARRITO DRAWER */
.drawer-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(74,20,140,0.4);
  z-index: 400;
  backdrop-filter: blur(2px);
}
.drawer-overlay.active { display: block; }
.drawer {
  position: fixed;
  top: 0; right: -100%;
  width: 92%; max-width: 420px;
  height: 100dvh;
  background: var(--white);
  z-index: 500;
  display: flex; flex-direction: column;
  transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow: -4px 0 24px rgba(74,20,140,0.2);
}
.drawer.open { right: 0; }
.drawer-header {
  background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid));
  padding: 48px 18px 16px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.drawer-title { color: white; font-size: 18px; font-weight: 600; flex: 1; }
.drawer-close {
  width: 34px; height: 34px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%; border: none;
  color: white; font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.drawer-content { flex: 1; overflow-y: auto; padding: 8px 16px 20px; }
.drawer-empty {
  text-align: center; padding: 60px 20px;
  color: var(--gray-text); font-size: 15px; line-height: 1.8;
}
.drawer-empty .emoji { font-size: 52px; display: block; margin-bottom: 14px; }
.cart-cat-header {
  font-size: 11px; font-weight: 600;
  color: var(--gray-text);
  letter-spacing: .06em; text-transform: uppercase;
  padding: 14px 0 6px;
  display: flex; align-items: center; gap: 6px;
}
.cart-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0;
  border-bottom: 0.5px solid var(--gray-border);
  transition: opacity 0.2s;
}
.cart-item:last-child { border-bottom: none; }
.cart-item.done { opacity: 0.45; }
.check-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--gray-border);
  background: var(--white);
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: white;
  transition: background 0.15s, border-color 0.15s;
}
.check-btn.done { background: var(--green); border-color: var(--green); }
.cart-name { flex: 1; font-size: 13px; color: var(--text); }
.cart-name.done { text-decoration: line-through; color: var(--gray-text); }
.cart-qty {
  font-size: 12px; font-weight: 700;
  color: var(--purple-mid);
  font-family: 'DM Mono', monospace;
  background: var(--purple-light);
  padding: 3px 9px; border-radius: 8px;
  flex-shrink: 0;
}
.drawer-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--gray-border);
  display: flex; gap: 8px;
  flex-shrink: 0;
}
.progress-summary {
  padding: 12px 16px 0;
  flex-shrink: 0;
}
.progress-summary-bar {
  height: 6px; background: var(--gray-border);
  border-radius: 3px; overflow: hidden; margin-bottom: 6px;
}
.progress-summary-fill {
  height: 100%; background: var(--green);
  border-radius: 3px; transition: width 0.3s;
}
.progress-summary-label {
  font-size: 12px; color: var(--gray-text); text-align: center;
}

/* BUTTONS */
.btn {
  flex: 1; padding: 13px;
  border-radius: 12px; border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: center;
  transition: transform 0.1s, opacity 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--purple-mid); color: white; }
.btn-danger { background: #ffebee; color: var(--red); border: 1.5px solid #ffcdd2; }
.btn-wa { background: #25D366; color: white; }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(74,20,140,0.4);
  z-index: 600; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--white);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px 40px;
  width: 100%; max-width: 480px;
}
.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.modal p { font-size: 14px; color: var(--gray-text); margin-bottom: 20px; }
.modal-btns { display: flex; gap: 10px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: #333; color: white;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; z-index: 700;
  opacity: 0; transition: opacity 0.3s;
  white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; }

/* LOADING */
.loading {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid));
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 800; transition: opacity 0.4s;
}
.loading img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 18px; }
.loading-title { color: white; font-size: 26px; font-weight: 600; margin-bottom: 6px; }
.loading-sub { color: rgba(255,255,255,0.65); font-size: 14px; }
.spinner {
  width: 30px; height: 30px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-top: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* SYNC INDICATOR */
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.4);
  position: absolute; bottom: 6px; right: 18px;
  transition: background 0.3s;
}
.sync-dot.syncing { background: #ffcc02; animation: pulse 1s infinite; }
.sync-dot.ok { background: #69f0ae; }
.sync-dot.error { background: #ff5252; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>

<!-- CART DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeCart()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">🛒 Mi carrito</span>
    <button class="drawer-close" onclick="closeCart()">✕</button>
  </div>
  <div class="progress-summary" id="progress-summary" style="display:none">
    <div class="progress-summary-bar">
      <div class="progress-summary-fill" id="progress-summary-fill"></div>
    </div>
    <div class="progress-summary-label" id="progress-summary-label"></div>
  </div>
  <div class="drawer-content" id="drawer-content"></div>
  <div class="drawer-footer">
    <button class="btn btn-danger" onclick="showResetModal()">🗑 Vaciar</button>
    <button class="btn btn-wa" onclick="compartir()">📤 WhatsApp</button>
  </div>
</div>

<!-- MODAL RESET -->
<div class="modal-overlay" id="modal-reset">
  <div class="modal">
    <h3>¿Vaciar el carrito?</h3>
    <p>Se borrarán todos los productos de la lista de compras.</p>
    <div class="modal-btns">
      <button class="btn" style="background:var(--gray-bg);color:var(--text);border:1.5px solid var(--gray-border)" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="resetLista()">Sí, vaciar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// CONFIGURACIÓN
// ═══════════════════════════════════════════════
const CATS_MAP = {
  "Almacén - Otros": "🏪",
  "Almacen - Otros": "🏪",
  "Almacen - Desayuno": "☕",
  "Almacén - Desayuno": "☕",
  "Almacen - Aderezos": "🫙",
  "Almacén - Aderezos": "🫙",
  "Congelados": "❄️",
  "Lácteos": "🧀",
  "Lacteos": "🧀",
  "Limpieza": "🧹",
  "Papeles": "🧻",
  "Perfumería": "🌸",
  "Perfumeria": "🌸",
  "Varios": "🛍️",
  "Otros": "📦"
};

// ═══════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════
let CATS = [];
let PRODS = [];
let lista = {};        // { id_producto: { id, name, cat, catEmoji, qty, done } }
let currentCat = null;
let currentProds = [];
let saveTimer = null;
let isSaving = false;

// ═══════════════════════════════════════════════
// LOCAL STORAGE
// ═══════════════════════════════════════════════
function loadLocal() {
  try { lista = JSON.parse(localStorage.getItem("compras_lista") || "{}"); } catch(e) { lista = {}; }
}
function saveLocal() {
  localStorage.setItem("compras_lista", JSON.stringify(lista));
}

// ═══════════════════════════════════════════════
// APPS SCRIPT — google.script.run
// ═══════════════════════════════════════════════
function syncSave() {
  clearTimeout(saveTimer);
  saveLocal();
  saveTimer = setTimeout(function() {
    setSyncDot("syncing");
    const items = Object.values(lista);
    google.script.run
      .withSuccessHandler(function() { setSyncDot("ok"); })
      .withFailureHandler(function() { setSyncDot("error"); })
      .saveLista(items);
  }, 1500);
}

function loadFromSheets() {
  return new Promise(function(resolve) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.lista && result.lista.length > 0) {
          lista = {};
          result.lista.forEach(function(item) {
            lista[item.id] = {
              id: item.id,
              name: item.name,
              cat: item.cat,
              catEmoji: item.catEmoji || getEmoji(item.cat),
              qty: Number(item.qty) || 0,
              done: item.done === true || item.done === "SI"
            };
          });
          saveLocal();
        }
        resolve();
      })
      .withFailureHandler(function() { resolve(); })
      .getLista();
  });
}

function loadCatsProds() {
  return new Promise(function(resolve) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.categorias) CATS = result.categorias;
        if (result && result.productos) PRODS = result.productos;
        resolve();
      })
      .withFailureHandler(function() { resolve(); })
      .getData();
  });
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function getEmoji(catName) {
  return CATS_MAP[catName] || "📦";
}

function totalItems() {
  return Object.values(lista).reduce(function(s, v) { return s + v.qty; }, 0);
}

function setSyncDot(state) {
  const d = document.getElementById("sync-dot");
  d.className = "sync-dot" + (state ? " " + state : "");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2500);
}

// ═══════════════════════════════════════════════
// BADGE CARRITO
// ═══════════════════════════════════════════════
function updateCartBadge() {
  const total = totalItems();
  const el = document.getElementById("cart-count");
  el.textContent = total;
  if (total > 0) el.classList.add("visible");
  else el.classList.remove("visible");
}

// ═══════════════════════════════════════════════
// CATEGORÍAS
// ═══════════════════════════════════════════════
function buildCats() {
  const grid = document.getElementById("cat-grid");
  grid.innerHTML = "";
  CATS.forEach(function(c) {
    const emoji = getEmoji(c.name);
    const itemCount = Object.values(lista)
      .filter(function(v) { return v.cat === c.name; })
      .reduce(function(s, v) { return s + v.qty; }, 0);
    const prodCount = PRODS.filter(function(p) { return p[2] === c.id; }).length;
    const d = document.createElement("div");
    d.className = "cat-card" + (itemCount > 0 ? " has-items" : "");
    d.innerHTML =
      '<span class="cat-badge' + (itemCount > 0 ? " visible" : "") + '">' + itemCount + '</span>' +
      '<span class="cat-emoji">' + emoji + '</span>' +
      '<span class="cat-name">' + c.name + '</span>' +
      '<span class="cat-count">' + prodCount + ' productos</span>';
    d.onclick = function() { openCat(c); };
    grid.appendChild(d);
  });
}

function openCat(c) {
  currentCat = c;
  currentProds = PRODS.filter(function(p) { return p[2] === c.id; });
  document.getElementById("search-input").value = "";
  renderProds(currentProds);
  document.getElementById("header-title").textContent = getEmoji(c.name) + " " + c.name;
  document.getElementById("back-btn").classList.add("visible");
  document.getElementById("progress-bar").style.display = "block";
  updateProgress();
  show("s-prods");
}

function updateProgress() {
  if (!currentCat) return;
  const catProds = PRODS.filter(function(p) { return p[2] === currentCat.id; });
  const sel = catProds.filter(function(p) { return lista[p[0]] && lista[p[0]].qty > 0; }).length;
  const pct = catProds.length > 0 ? (sel / catProds.length) * 100 : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
}

// ═══════════════════════════════════════════════
// PRODUCTOS
// ═══════════════════════════════════════════════
function renderProds(prods) {
  const el = document.getElementById("prod-list");
  el.innerHTML = "";
  if (!prods.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--gray-text);font-size:15px;">No se encontraron productos</div>';
    return;
  }
  prods.forEach(function(p) {
    const qty = (lista[p[0]] && lista[p[0]].qty) || 0;
    const d = document.createElement("div");
    d.className = "prod-item" + (qty > 0 ? " selected" : "");
    d.id = "prod-" + p[0];
    d.innerHTML =
      '<span class="prod-name">' + p[1] + '</span>' +
      '<div class="qty-control">' +
        '<button class="qty-btn" onclick="chg(' + p[0] + ',-1)">−</button>' +
        '<span class="qty-num' + (qty > 0 ? " pos" : "") + '" id="qn-' + p[0] + '">' + qty + '</span>' +
        '<button class="qty-btn" onclick="chg(' + p[0] + ',1)">+</button>' +
      '</div>';
    el.appendChild(d);
  });
}

function filterProds() {
  const q = document.getElementById("search-input").value.toLowerCase().trim();
  renderProds(q ? currentProds.filter(function(p) { return p[1].toLowerCase().includes(q); }) : currentProds);
}

function chg(key, delta) {
  const prod = PRODS.find(function(p) { return p[0] === key; });
  if (!prod) return;
  const cat = CATS.find(function(c) { return c.id === prod[2]; });
  if (!lista[key]) lista[key] = { id: key, qty: 0, name: prod[1], cat: cat ? cat.name : "", catEmoji: getEmoji(cat ? cat.name : ""), done: false };
  lista[key].qty = Math.max(0, lista[key].qty + delta);
  if (lista[key].qty === 0) delete lista[key];
  // Update UI
  const qn = document.getElementById("qn-" + key);
  const pi = document.getElementById("prod-" + key);
  if (qn) {
    const qty = (lista[key] && lista[key].qty) || 0;
    qn.textContent = qty;
    qn.className = "qty-num" + (qty > 0 ? " pos" : "");
    if (pi) pi.className = "prod-item" + (qty > 0 ? " selected" : "");
  }
  updateProgress();
  updateCartBadge();
  buildCats();
  syncSave();
}

// ═══════════════════════════════════════════════
// CARRITO DRAWER
// ═══════════════════════════════════════════════
function openCart() {
  renderCart();
  document.getElementById("drawer-overlay").classList.add("active");
  document.getElementById("drawer").classList.add("open");
}

function closeCart() {
  document.getElementById("drawer-overlay").classList.remove("active");
  document.getElementById("drawer").classList.remove("open");
}

function renderCart() {
  const el = document.getElementById("drawer-content");
  const items = Object.entries(lista);

  if (!items.length) {
    el.innerHTML = '<div class="drawer-empty"><span class="emoji">🛒</span>El carrito está vacío.<br>Seleccioná categorías para<br>agregar productos.</div>';
    document.getElementById("progress-summary").style.display = "none";
    return;
  }

  // Progreso
  const total = items.length;
  const doneCount = items.filter(function(e) { return e[1].done; }).length;
  const pct = Math.round((doneCount / total) * 100);
  document.getElementById("progress-summary").style.display = "block";
  document.getElementById("progress-summary-fill").style.width = pct + "%";
  document.getElementById("progress-summary-label").textContent = doneCount + " de " + total + " productos comprados";

  // Agrupar por categoría
  const byCat = {};
  items.forEach(function(entry) {
    const v = entry[1];
    if (!byCat[v.cat]) byCat[v.cat] = { emoji: v.catEmoji || getEmoji(v.cat), items: [] };
    byCat[v.cat].items.push({ k: entry[0], v: v });
  });

  el.innerHTML = "";
  Object.entries(byCat).forEach(function(entry) {
    const cat = entry[0]; const data = entry[1];
    const pending = data.items.filter(function(i) { return !i.v.done; });
    const done = data.items.filter(function(i) { return i.v.done; });
    const sec = document.createElement("div");
    let h = '<div class="cart-cat-header">' + data.emoji + ' ' + cat + '</div>';
    [...pending, ...done].forEach(function(item) {
      const k = item.k; const v = item.v;
      h += '<div class="cart-item' + (v.done ? " done" : "") + '" id="ci-' + k + '">' +
        '<button class="check-btn' + (v.done ? " done" : "") + '" onclick="toggleDone(' + k + ')">' + (v.done ? "✓" : "") + '</button>' +
        '<span class="cart-name' + (v.done ? " done" : "") + '">' + v.name + '</span>' +
        '<span class="cart-qty">×' + v.qty + '</span>' +
        '</div>';
    });
    sec.innerHTML = h;
    el.appendChild(sec);
  });
}

function toggleDone(k) {
  if (!lista[k]) return;
  lista[k].done = !lista[k].done;
  syncSave();
  renderCart();
}

// ═══════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════
function showResetModal() { document.getElementById("modal-reset").classList.add("active"); }
function closeModal() { document.getElementById("modal-reset").classList.remove("active"); }

function resetLista() {
  lista = {};
  saveLocal();
  closeModal();
  closeCart();
  buildCats();
  updateCartBadge();
  setSyncDot("syncing");
  google.script.run
    .withSuccessHandler(function() { setSyncDot("ok"); showToast("✓ Carrito vaciado"); })
    .withFailureHandler(function() { setSyncDot("error"); showToast("✓ Vaciado localmente"); })
    .saveLista([]);
}

// ═══════════════════════════════════════════════
// COMPARTIR
// ═══════════════════════════════════════════════
function compartir() {
  const items = Object.values(lista).filter(function(v) { return !v.done; });
  if (!items.length) { showToast("El carrito está vacío"); return; }
  const byCat = {};
  items.forEach(function(v) {
    if (!byCat[v.cat]) byCat[v.cat] = [];
    byCat[v.cat].push(v);
  });
  let texto = "🛒 *Lista del Super*\n\n";
  Object.entries(byCat).forEach(function(e) {
    texto += "*" + e[0] + "*\n";
    e[1].forEach(function(p) { texto += "• " + p.name + " (×" + p.qty + ")\n"; });
    texto += "\n";
  });
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
}

// ═══════════════════════════════════════════════
// NAVEGACIÓN
// ═══════════════════════════════════════════════
function goBack() {
  currentCat = null;
  document.getElementById("header-title").textContent = "Compras";
  document.getElementById("back-btn").classList.remove("visible");
  document.getElementById("progress-bar").style.display = "none";
  buildCats();
  show("s-cats");
}

function show(id) {
  ["s-cats", "s-prods"].forEach(function(s) {
    document.getElementById(s).className = "screen" + (s === id ? " active" : "");
  });
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
async function init() {
  loadLocal();
  updateCartBadge();

  document.getElementById("loading-sub").textContent = "Cargando productos...";
  await loadCatsProds();

  document.getElementById("loading-sub").textContent = "Sincronizando lista...";
  await loadFromSheets();

  buildCats();
  updateCartBadge();

  setTimeout(function() {
    const l = document.getElementById("loading");
    l.style.opacity = "0";
    setTimeout(function() { l.style.display = "none"; }, 400);
  }, 500);
}

init();
</script>
</body>
</html>
