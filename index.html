<style>
:root {
  --purple:#6a1b9a; --purple-mid:#7b1fa2; --purple-dark:#4a148c;
  --purple-light:#f3e5f5; --purple-accent:#ab47bc;
  --white:#fff; --gray-bg:#faf5ff; --gray-border:#e1d5ea;
  --gray-text:#7b6b8a; --text:#1a0a2e;
  --red:#c62828; --green:#2e7d32;
  --radius:16px; --radius-sm:10px;
  --shadow:0 2px 16px rgba(106,27,154,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--gray-bg);color:var(--text);
  display:flex;flex-direction:column;
  height:100dvh;width:100%;overflow:hidden;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--purple-dark),var(--purple-mid));
  padding:env(safe-area-inset-top,48px) 18px 14px;
  padding-top:max(env(safe-area-inset-top),48px);
  flex-shrink:0;display:flex;align-items:center;gap:12px;position:relative;
}
.header-back{
  width:40px;height:40px;background:rgba(255,255,255,0.18);
  border-radius:50%;border:none;color:white;font-size:20px;
  cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;
}
.header-back.visible{display:flex}
.header-title{font-size:22px;font-weight:600;color:white;flex:1}
.cart-btn{
  position:relative;width:48px;height:48px;
  background:rgba(255,255,255,0.18);border-radius:50%;border:none;
  color:white;font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cart-count{
  position:absolute;top:-4px;right:-4px;
  background:#ff6b35;color:white;
  font-size:12px;font-weight:700;min-width:20px;height:20px;
  border-radius:10px;display:none;align-items:center;justify-content:center;
  padding:0 5px;font-family:'DM Mono',monospace;
}
.cart-count.visible{display:flex}
.sync-dot{
  width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,0.35);
  position:absolute;bottom:7px;right:18px;transition:background 0.3s;
}
.sync-dot.syncing{background:#ffcc02;animation:pulse 1s infinite}
.sync-dot.ok{background:#69f0ae}
.sync-dot.error{background:#ff5252}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

.progress-bar{height:4px;background:rgba(255,255,255,0.2);flex-shrink:0}
.progress-fill{height:100%;background:#ce93d8;transition:width 0.3s;width:0%}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{display:none}.screen.active{display:block}

/* CATEGORÍAS */
.section-label{
  padding:18px 18px 10px;font-size:13px;font-weight:600;
  color:var(--gray-text);letter-spacing:.06em;text-transform:uppercase;
}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 24px}
.cat-card{
  background:var(--white);border:1.5px solid var(--gray-border);
  border-radius:var(--radius);padding:22px 12px 18px;text-align:center;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;
  position:relative;box-shadow:var(--shadow);transition:border-color .15s,transform .1s;
  min-height:130px;
}
.cat-card:active{transform:scale(0.97)}
.cat-card.has-items{border-color:var(--purple-accent);background:var(--purple-light)}
.cat-emoji{font-size:42px;line-height:1}
.cat-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.3}
.cat-count{font-size:13px;color:var(--gray-text)}
.cat-badge{
  position:absolute;top:9px;right:9px;
  background:var(--purple-accent);color:white;
  font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;
  font-family:'DM Mono',monospace;display:none;
}
.cat-badge.visible{display:block}

/* PRODUCTOS */
.search-wrap{padding:12px 14px 8px;position:relative}
.search-input{
  width:100%;padding:14px 14px 14px 44px;
  border:1.5px solid var(--gray-border);border-radius:12px;
  background:var(--white);font-family:'DM Sans',sans-serif;
  font-size:17px;color:var(--text);outline:none;
}
.search-input:focus{border-color:var(--purple-accent)}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--gray-text);pointer-events:none}
.prod-list{padding:4px 14px 24px}
.prod-item{
  background:var(--white);border-radius:var(--radius-sm);margin-bottom:10px;
  padding:16px 14px;display:flex;align-items:center;gap:12px;
  border:1px solid var(--gray-border);
  box-shadow:0 1px 4px rgba(106,27,154,0.06);
}
.prod-item.selected{border-color:var(--purple-accent);background:var(--purple-light)}
.prod-name{flex:1;font-size:16px;color:var(--text);line-height:1.4}
.qty-control{display:flex;align-items:center;gap:10px;flex-shrink:0}
.qty-btn{
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid var(--gray-border);background:var(--white);
  color:var(--purple-mid);font-size:24px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;
}
.qty-btn:active{background:var(--purple-light);border-color:var(--purple-accent)}
.qty-num{min-width:30px;text-align:center;font-size:18px;font-weight:700;color:var(--gray-text);font-family:'DM Mono',monospace}
.qty-num.pos{color:var(--purple-mid)}

/* CARRITO */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(74,20,140,0.45);z-index:400;backdrop-filter:blur(3px)}
.drawer-overlay.active{display:block}
.drawer{
  position:fixed;top:0;right:-100%;width:100%;height:100dvh;
  background:var(--white);z-index:500;display:flex;flex-direction:column;
  transition:right 0.28s cubic-bezier(0.4,0,0.2,1);
}
.drawer.open{right:0}
.drawer-header{
  background:linear-gradient(135deg,var(--purple-dark),var(--purple-mid));
  padding:max(env(safe-area-inset-top),48px) 18px 18px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.drawer-title{color:white;font-size:22px;font-weight:600;flex:1}
.drawer-close{width:40px;height:40px;background:rgba(255,255,255,0.18);border-radius:50%;border:none;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer-content{flex:1;overflow-y:auto;padding:8px 18px 20px}
.drawer-empty{text-align:center;padding:60px 20px;color:var(--gray-text);font-size:16px;line-height:1.8}
.drawer-empty .emoji{font-size:56px;display:block;margin-bottom:14px}
.cart-cat-header{font-size:13px;font-weight:600;color:var(--gray-text);letter-spacing:.06em;text-transform:uppercase;padding:16px 0 8px;display:flex;align-items:center;gap:6px}
.cart-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:0.5px solid var(--gray-border);transition:opacity .2s}
.cart-item:last-child{border-bottom:none}
.cart-item.done{opacity:0.4}
.check-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gray-border);background:var(--white);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:white;transition:background .15s,border-color .15s}
.check-btn.done{background:var(--green);border-color:var(--green)}
.cart-name{flex:1;font-size:16px;color:var(--text)}
.cart-name.done{text-decoration:line-through;color:var(--gray-text)}
.cart-qty{font-size:14px;font-weight:700;color:var(--purple-mid);font-family:'DM Mono',monospace;background:var(--purple-light);padding:4px 10px;border-radius:8px;flex-shrink:0}
.drawer-footer{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--gray-border);display:flex;gap:10px;flex-shrink:0}
.progress-summary{padding:14px 18px 0;flex-shrink:0}
.progress-summary-bar{height:7px;background:var(--gray-border);border-radius:4px;overflow:hidden;margin-bottom:7px}
.progress-summary-fill{height:100%;background:var(--green);border-radius:4px;transition:width 0.3s}
.progress-summary-label{font-size:14px;color:var(--gray-text);text-align:center}

/* BUTTONS */
.btn{flex:1;padding:16px;border-radius:14px;border:none;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;text-align:center;transition:transform .1s}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--purple-mid);color:white}
.btn-danger{background:#ffebee;color:var(--red);border:1.5px solid #ffcdd2}
.btn-wa{background:#25D366;color:white}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(74,20,140,0.45);z-index:600;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-overlay.active{display:flex}
.modal{background:var(--white);border-radius:20px 20px 0 0;padding:28px 20px calc(32px + env(safe-area-inset-bottom));width:100%}
.modal h3{font-size:20px;font-weight:600;margin-bottom:10px}
.modal p{font-size:16px;color:var(--gray-text);margin-bottom:22px}
.modal-btns{display:flex;gap:10px}

/* TOAST */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 22px;border-radius:22px;font-size:14px;z-index:700;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}

/* LOADING */
.loading{position:fixed;inset:0;background:linear-gradient(135deg,var(--purple-dark),var(--purple-mid));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:800;transition:opacity .4s}
.loading img{width:92px;height:92px;border-radius:22px;margin-bottom:20px}
.loading-title{color:white;font-size:28px;font-weight:600;margin-bottom:8px}
.loading-sub{color:rgba(255,255,255,.65);font-size:15px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;margin-top:26px}
@keyframes spin{to{transform:rotate(360deg)}}

/* UBICACIONES */
.loc-grid{display:flex;flex-direction:column;gap:18px;padding:8px 18px 28px}
.loc-card{
  background:var(--white);border:2px solid var(--gray-border);border-radius:24px;
  padding:22px 16px 20px;text-align:center;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .1s,border-color .15s;
}
.loc-card:active{transform:scale(0.98);border-color:var(--purple-accent)}
.loc-card svg{width:150px;height:130px}
.loc-name{font-size:24px;font-weight:600;color:var(--purple-dark)}
.retry-box{text-align:center;padding:40px 24px;color:var(--gray-text);font-size:16px;line-height:1.6}
.retry-box .btn{margin-top:18px;max-width:240px}
.cart-btn.hidden{display:none}
</style>
</head>

  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeCart()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title" id="drawer-title">🛒 Mi carrito</span>
    <button class="drawer-close" onclick="closeCart()">✕</button>
  </div>
  <div class="progress-summary" id="progress-summary" style="display:none">
    <div class="progress-summary-bar"><div class="progress-summary-fill" id="progress-summary-fill"></div></div>
    <div class="progress-summary-label" id="progress-summary-label"></div>
  </div>
  <div class="drawer-content" id="drawer-content"></div>
  <div class="drawer-footer">
    <button class="btn btn-danger" onclick="showResetModal()">🗑 Vaciar</button>
    <button class="btn btn-wa" onclick="compartir()">📤 WhatsApp</button>
  </div>
</div>

<div class="modal-overlay" id="modal-reset">
  <div class="modal">
    <h3>¿Vaciar el carrito?</h3>
    <p id="reset-text">Se borrarán todos los productos de este carrito.</p>
    <div class="modal-btns">
      <button class="btn" style="background:var(--gray-bg);color:var(--text);border:1.5px solid var(--gray-border)" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="resetLista()">Sí, vaciar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbWyD2ykYgiyr4baCedQze2YljTuqULtxyYuhIhAqZf-zOoMw5wNH0LtlVR-NDAZIr/exec";

const CATS_MAP = {
  "Almacén - Otros":"🏪","Almacen - Otros":"🏪",
  "Almacen - Desayuno":"☕","Almacén - Desayuno":"☕",
  "Almacen - Aderezos":"🫙","Almacén - Aderezos":"🫙",
  "Congelados":"❄️","Lácteos":"🧀","Lacteos":"🧀",
  "Limpieza":"🧹","Papeles":"🧻",
  "Perfumería":"🌸","Perfumeria":"🌸",
  "Varios":"🛍️","Otros":"📦"
};

// Dibujos por ID_Ubicacion (1 = casa, 2 = departamento)
const DRAW = {
  "1":'<svg viewBox="0 0 150 130"><polygon points="75,8 8,62 142,62" fill="#7b1fa2"/><rect x="22" y="62" width="106" height="62" rx="4" fill="#e1bee7"/><rect x="62" y="82" width="26" height="42" rx="3" fill="#6a1b9a"/><circle cx="83" cy="104" r="2.5" fill="#f3e5f5"/><rect x="30" y="74" width="22" height="22" rx="3" fill="#fff" stroke="#ab47bc" stroke-width="3"/><rect x="98" y="74" width="22" height="22" rx="3" fill="#fff" stroke="#ab47bc" stroke-width="3"/><rect x="100" y="14" width="14" height="26" fill="#4a148c"/></svg>',
  "2":'<svg viewBox="0 0 150 130"><rect x="34" y="8" width="82" height="116" rx="5" fill="#e1bee7"/><rect x="34" y="8" width="82" height="12" rx="5" fill="#7b1fa2"/><g fill="#fff" stroke="#ab47bc" stroke-width="2.5"><rect x="44" y="28" width="18" height="16" rx="2"/><rect x="66" y="28" width="18" height="16" rx="2"/><rect x="88" y="28" width="18" height="16" rx="2"/><rect x="44" y="52" width="18" height="16" rx="2"/><rect x="66" y="52" width="18" height="16" rx="2"/><rect x="88" y="52" width="18" height="16" rx="2"/><rect x="44" y="76" width="18" height="16" rx="2"/><rect x="66" y="76" width="18" height="16" rx="2"/><rect x="88" y="76" width="18" height="16" rx="2"/></g><rect x="64" y="100" width="22" height="24" rx="3" fill="#6a1b9a"/></svg>'
};
const DRAW_DEFAULT = '<svg viewBox="0 0 150 130"><circle cx="75" cy="65" r="45" fill="#e1bee7"/><text x="75" y="82" font-size="50" text-anchor="middle">📍</text></svg>';

let UBIC=[], CATS=[], PRODS=[];
let ubic=null;            // ubicación activa {id,name}
let lista={};             // carrito de la ubicación activa, clave = ID_Producto
let currentCat=null, currentProds=[];
let ready=false;          // true sólo si la lista de la ubicación se leyó bien

function getEmoji(n){ return CATS_MAP[n]||"📦"; }
function totalItems(){ return Object.values(lista).reduce(function(s,v){return s+v.qty;},0); }
function setSyncDot(s){ document.getElementById("sync-dot").className="sync-dot"+(s?" "+s:""); }
function showToast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},2500); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function updateCartBadge(){
  var total=totalItems(), el=document.getElementById("cart-count");
  el.textContent=total;
  if(total>0) el.classList.add("visible"); else el.classList.remove("visible");
}

// ── JSONP ──
var cbSeq=0;
function callGS(action, data){
  return new Promise(function(resolve, reject){
    var cbName = "gs_cb_" + Date.now() + "_" + (++cbSeq);
    var script = document.createElement("script");
    var url = SCRIPT_URL + "?action=" + action + "&callback=" + cbName;
    if(data) url += "&data=" + encodeURIComponent(JSON.stringify(data));
    var done=false;
    function cleanup(){
      done=true; clearTimeout(tm);
      try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; }
      try{ document.body.removeChild(script); }catch(e){}
    }
    var tm=setTimeout(function(){ if(done) return; cleanup(); reject(new Error("timeout")); },25000);
    window[cbName] = function(result){
      if(done) return; cleanup();
      if(result && result.error) reject(new Error(result.error)); else resolve(result);
    };
    script.onerror = function(){ if(done) return; cleanup(); reject(new Error("red")); };
    script.src = url;
    document.body.appendChild(script);
  });
}

// ── COLA DE ESCRITURA: un producto por vez, en orden, con reintentos ──
var queue=[], working=false, failing=false;
function pendingCount(){ return queue.length+(working?1:0); }

function enqueueSet(item){
  // reemplaza una orden pendiente (no en vuelo) del mismo producto/ubicación
  for(var i=queue.length-1;i>=0;i--){
    if(queue[i].type==="set" && queue[i].d.id===item.d.id && queue[i].d.ubic===item.d.ubic){ queue.splice(i,1); }
  }
  queue.push(item); pump();
}
function enqueueClear(u){
  queue=queue.filter(function(o){ return !(o.type==="set" && o.d.ubic===u); });
  queue.push({type:"clear",d:{ubic:u}}); pump();
}
async function pump(){
  if(working) return;
  working=true;
  while(queue.length){
    var op=queue.shift();            // la orden en vuelo sale de la cola
    setSyncDot(failing?"error":"syncing");
    try{
      await callGS(op.type==="set"?"setItem":"clearUbicacion", op.d);
      failing=false;
    }catch(e){
      failing=true; setSyncDot("error");
      var newer=op.type==="set" && queue.some(function(o){return o.type==="set"&&o.d.id===op.d.id&&o.d.ubic===op.d.ubic;});
      if(!newer) queue.unshift(op);  // reintenta la misma orden
      await new Promise(function(r){setTimeout(r,3000);});
    }
  }
  working=false;
  setSyncDot(failing?"error":"ok");
}
window.addEventListener("beforeunload",function(e){ if(pendingCount()>0){ e.preventDefault(); e.returnValue=""; } });

// ── CARGA ──
async function loadBase(){
  var r = await callGS("getData");
  if(!r || !r.categorias || !r.productos || !r.ubicaciones) throw new Error("datos incompletos");
  UBIC=r.ubicaciones; CATS=r.categorias; PRODS=r.productos;
}

async function loadLista(){
  var r = await callGS("getLista",{ubic:ubic.id});
  if(!r || !r.lista) throw new Error("lista invalida");
  lista={};
  r.lista.forEach(function(item){
    lista[item.id]={id:item.id,name:item.name,cat:item.cat,catEmoji:getEmoji(item.cat),qty:Number(item.qty)||0,done:item.done===true};
  });
}

function prodsOfUbic(){ return PRODS.filter(function(p){return String(p[3])===String(ubic.id);}); }

// ── PANTALLA UBICACIONES ──
function buildLocs(){
  var g=document.getElementById("loc-grid"); g.innerHTML="";
  UBIC.forEach(function(u){
    var d=document.createElement("div"); d.className="loc-card";
    d.innerHTML=(DRAW[String(u.id)]||DRAW_DEFAULT)+'<span class="loc-name">'+esc(u.name)+'</span>';
    d.onclick=function(){ enterLoc(u); };
    g.appendChild(d);
  });
}

async function enterLoc(u){
  var l=document.getElementById("loading");
  document.getElementById("loading-sub").textContent="Abriendo "+u.name+"...";
  l.style.display="flex"; l.style.opacity="1";
  ubic=u; ready=false;
  try{
    await loadLista();
    ready=true;
  }catch(e){
    l.style.display="none"; ubic=null;
    showToast("No se pudo leer la lista. Probá de nuevo."); return;
  }
  l.style.opacity="0"; setTimeout(function(){l.style.display="none";},300);
  document.getElementById("cart-btn").classList.remove("hidden");
  buildCats(); updateCartBadge(); goBack(true);
}

function leaveLoc(){
  ubic=null; ready=false; lista={}; currentCat=null;
  document.getElementById("header-title").textContent="Compras";
  document.getElementById("back-btn").classList.remove("visible");
  document.getElementById("cart-btn").classList.add("hidden");
  document.getElementById("progress-bar").style.display="none";
  show("s-locs");
}

// ── CATEGORÍAS (sólo las que tienen productos en la ubicación) ──
function buildCats(){
  var grid=document.getElementById("cat-grid"); grid.innerHTML="";
  var up=prodsOfUbic();
  CATS.forEach(function(c){
    var prodCount=up.filter(function(p){return p[2]===c.id;}).length;
    if(!prodCount) return;
    var itemCount=Object.values(lista).filter(function(v){return v.cat===c.name;}).reduce(function(s,v){return s+v.qty;},0);
    var d=document.createElement("div");
    d.className="cat-card"+(itemCount>0?" has-items":"");
    d.innerHTML='<span class="cat-badge'+(itemCount>0?" visible":"")+'">'+itemCount+'</span>'+
      '<span class="cat-emoji">'+getEmoji(c.name)+'</span>'+
      '<span class="cat-name">'+esc(c.name)+'</span>'+
      '<span class="cat-count">'+prodCount+' productos</span>';
    d.onclick=function(){openCat(c);};
    grid.appendChild(d);
  });
}

function openCat(c){
  currentCat=c; currentProds=prodsOfUbic().filter(function(p){return p[2]===c.id;});
  document.getElementById("search-input").value="";
  renderProds(currentProds);
  document.getElementById("header-title").textContent=getEmoji(c.name)+" "+c.name;
  document.getElementById("back-btn").classList.add("visible");
  document.getElementById("progress-bar").style.display="block";
  updateProgress(); show("s-prods");
}

function updateProgress(){
  if(!currentCat) return;
  var sel=currentProds.filter(function(p){return lista[p[0]]&&lista[p[0]].qty>0;}).length;
  document.getElementById("progress-fill").style.width=(currentProds.length>0?(sel/currentProds.length)*100:0)+"%";
}

function renderProds(prods){
  var el=document.getElementById("prod-list"); el.innerHTML="";
  if(!prods.length){ el.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--gray-text);font-size:16px;">No se encontraron productos</div>'; return; }
  prods.forEach(function(p){
    var qty=(lista[p[0]]&&lista[p[0]].qty)||0;
    var d=document.createElement("div");
    d.className="prod-item"+(qty>0?" selected":""); d.id="prod-"+p[0];
    d.innerHTML='<span class="prod-name">'+esc(p[1])+'</span>'+
      '<div class="qty-control">'+
        '<button class="qty-btn" onclick="chg('+p[0]+',-1)">−</button>'+
        '<span class="qty-num'+(qty>0?" pos":"")+'" id="qn-'+p[0]+'">'+qty+'</span>'+
        '<button class="qty-btn" onclick="chg('+p[0]+',1)">+</button>'+
      '</div>';
    el.appendChild(d);
  });
}

function filterProds(){
  var q=document.getElementById("search-input").value.toLowerCase().trim();
  renderProds(q?currentProds.filter(function(p){return String(p[1]).toLowerCase().includes(q);}):currentProds);
}

function pushItem(key){
  var v=lista[key];
  if(v) enqueueSet({type:"set",d:{id:v.id,name:v.name,cat:v.cat,qty:v.qty,done:!!v.done,ubic:ubic.id}});
}

function chg(key,delta){
  if(!ready) return;
  var prod=PRODS.find(function(p){return p[0]===key;});
  if(!prod) return;
  var cat=CATS.find(function(c){return c.id===prod[2];});
  var wasNew=!lista[key];
  if(wasNew) lista[key]={id:key,qty:0,name:prod[1],cat:cat?cat.name:"",catEmoji:getEmoji(cat?cat.name:""),done:false};
  lista[key].qty=Math.max(0,lista[key].qty+delta);
  var qty=lista[key].qty;
  if(qty===0){
    enqueueSet({type:"set",d:{id:key,name:prod[1],cat:cat?cat.name:"",qty:0,done:false,ubic:ubic.id}});
    delete lista[key];
  } else pushItem(key);
  var qn=document.getElementById("qn-"+key), pi=document.getElementById("prod-"+key);
  if(qn){ qn.textContent=qty; qn.className="qty-num"+(qty>0?" pos":""); if(pi) pi.className="prod-item"+(qty>0?" selected":""); }
  updateProgress(); updateCartBadge(); buildCats();
}

// ── CARRITO ──
function openCart(){ renderCart(); document.getElementById("drawer-title").textContent="🛒 Carrito · "+ubic.name; document.getElementById("drawer-overlay").classList.add("active"); document.getElementById("drawer").classList.add("open"); }
function closeCart(){ document.getElementById("drawer-overlay").classList.remove("active"); document.getElementById("drawer").classList.remove("open"); }

function renderCart(){
  var el=document.getElementById("drawer-content"), items=Object.entries(lista);
  if(!items.length){ el.innerHTML='<div class="drawer-empty"><span class="emoji">🛒</span>El carrito está vacío.<br>Seleccioná categorías para<br>agregar productos.</div>'; document.getElementById("progress-summary").style.display="none"; return; }
  var total=items.length, doneCount=items.filter(function(e){return e[1].done;}).length;
  var pct=Math.round((doneCount/total)*100);
  document.getElementById("progress-summary").style.display="block";
  document.getElementById("progress-summary-fill").style.width=pct+"%";
  document.getElementById("progress-summary-label").textContent=doneCount+" de "+total+" productos comprados";
  var byCat={};
  items.forEach(function(entry){ var v=entry[1]; if(!byCat[v.cat]) byCat[v.cat]={emoji:v.catEmoji||getEmoji(v.cat),items:[]}; byCat[v.cat].items.push({k:entry[0],v:v}); });
  el.innerHTML="";
  Object.entries(byCat).forEach(function(entry){
    var cat=entry[0], data=entry[1];
    var pending=data.items.filter(function(i){return !i.v.done;}), done=data.items.filter(function(i){return i.v.done;});
    var sec=document.createElement("div");
    var h='<div class="cart-cat-header">'+data.emoji+' '+esc(cat)+'</div>';
    [...pending,...done].forEach(function(item){
      var k=item.k, v=item.v;
      h+='<div class="cart-item'+(v.done?" done":"")+'" id="ci-'+k+'">'+
        '<button class="check-btn'+(v.done?" done":"")+'" onclick="toggleDone('+k+')">'+(v.done?"✓":"")+'</button>'+
        '<span class="cart-name'+(v.done?" done":"")+'">'+esc(v.name)+'</span>'+
        '<span class="cart-qty">×'+v.qty+'</span></div>';
    });
    sec.innerHTML=h; el.appendChild(sec);
  });
}

function toggleDone(k){ if(!lista[k]||!ready) return; lista[k].done=!lista[k].done; pushItem(k); renderCart(); }

function showResetModal(){ document.getElementById("reset-text").textContent="Se borrarán todos los productos del carrito de "+ubic.name+"."; document.getElementById("modal-reset").classList.add("active"); }
function closeModal(){ document.getElementById("modal-reset").classList.remove("active"); }

function resetLista(){
  if(!ready) return;
  lista={}; closeModal(); closeCart(); buildCats(); updateCartBadge();
  if(currentCat) renderProds(currentProds), updateProgress();
  enqueueClear(ubic.id); showToast("✓ Carrito vaciado");
}

function compartir(){
  var items=Object.values(lista).filter(function(v){return !v.done;});
  if(!items.length){showToast("El carrito está vacío");return;}
  var byCat={};
  items.forEach(function(v){if(!byCat[v.cat])byCat[v.cat]=[];byCat[v.cat].push(v);});
  var texto="🛒 *Lista del Super · "+ubic.name+"*\n\n";
  Object.entries(byCat).forEach(function(e){ texto+="*"+e[0]+"*\n"; e[1].forEach(function(p){texto+="• "+p.name+" (×"+p.qty+")\n";}); texto+="\n"; });
  window.open("https://wa.me/?text="+encodeURIComponent(texto),"_blank");
}

function goBack(toCats){
  if(toCats!==true && currentCat===null && ubic){ leaveLoc(); return; }   // desde categorías -> ubicaciones
  currentCat=null;
  document.getElementById("header-title").textContent=ubic?ubic.name:"Compras";
  document.getElementById("back-btn").classList.add("visible");
  document.getElementById("progress-bar").style.display="none";
  buildCats(); show("s-cats");
}

function show(id){ ["s-locs","s-cats","s-prods"].forEach(function(s){ document.getElementById(s).className="screen"+(s===id?" active":""); }); }

// al volver a la app, refrescar el carrito si no hay nada pendiente de enviar
document.addEventListener("visibilitychange",async function(){
  if(document.visibilityState!=="visible"||!ubic||!ready||pendingCount()>0) return;
  var u=ubic;
  try{
    var before=JSON.stringify(lista);
    await loadLista();
    if(ubic!==u||pendingCount()>0){ return; }
    if(JSON.stringify(lista)!==before){
      updateCartBadge(); buildCats();
      if(currentCat){ renderProds(currentProds); updateProgress(); }
      if(document.getElementById("drawer").classList.contains("open")) renderCart();
    }
  }catch(e){}
});

async function init(){
  document.getElementById("loading-sub").textContent="Cargando productos...";
  try{
    await loadBase();
    buildLocs();
    var l=document.getElementById("loading"); l.style.opacity="0"; setTimeout(function(){l.style.display="none";},400);
  }catch(e){
    document.getElementById("loading").style.display="none";
    document.getElementById("loc-grid").innerHTML='<div class="retry-box">No se pudo conectar con la planilla.<br>Revisá tu conexión.<button class="btn btn-primary" onclick="location.reload()">Reintentar</button></div>';
  }
}

init();
</script>
</body>
